[package]
name = "osu-tablet-optimizer"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = "0.4"
dirs = "7"
iced = "0.14"
lzma-rs = "0.3"
md5 = "0.8"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
rosu-map = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
