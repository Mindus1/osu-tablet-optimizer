[package]
name = "osu-tablet-optimizer"
version = "0.2.2"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
chrono = "0.4"
dirs = "7"
iced = { version = "0.14", features = ["canvas"] }
lzma-rs = "0.3"
md5 = "0.8"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
rosu-map = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Finds the Windows SDK's resource compiler to embed the exe icon (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
