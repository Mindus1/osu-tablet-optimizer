name: Release

on:
  push:
    tags: ['v*']

# Only publish gets a write token; the build jobs run third-party actions.
permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match Cargo.toml version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "${tag%%-*}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  build:
    needs: verify-version
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          # Oldest runner on purpose: the binary only runs on distros with glibc >= the build host's.
          - os: ubuntu-22.04
            target: linux-x64
          # ponytail: Apple silicon only; add an Intel macOS runner row if someone needs it.
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      ASSET: osu-tablet-optimizer-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: VERSION="${GITHUB_REF_NAME#v}" bash .github/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--generate-notes"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" $flags
